name: Manifest checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# shell: bash runs with -eo pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  CLAUDE_CODE_VERSION: 2.1.326
  # No auto-update, telemetry or error reporting from Claude Code during the checks.
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  manifest-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      # Installs the exact ajv versions of ci/package-lock.json. The checks need no network after this step.
      - name: Install ajv
        run: npm ci --prefix ci

      - name: Validate manifests
        run: node ci/validate.mjs

      - name: Fixtures
        run: node --test ci/validate.test.mjs

      # The checks above need no network. Only this step downloads Claude Code, so it retries.
      - name: Install Claude Code
        run: |
          for attempt in 1 2 3; do
            if npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"; then
              exit 0
            fi
            echo "Install attempt ${attempt} failed" >&2
            if [ "${attempt}" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1

      - name: Claude plugin validate
        run: claude plugin validate . --strict
